# Lints the chain-labs PHP, checks it against the recorded source hashes and runs the refusal smoke test, and the ledger store, coin form, spending, multi authority, purchase and endpoint tests. It deploys
# nothing and needs no secrets. The labs use PHP 8.1 features (never return type, array_is_list).
name: chain-labs

on:
  push:
    paths:
      - 'chain-labs/**'
      - 'test/chain-labs-import.js'
      - 'test/chain-labs-config.js'
      - 'test/chain-labs-ledger.php'
      - 'test/chain-labs-coin-form.js'
      - 'test/chain-labs-spend.php'
      - 'test/chain-labs-spend-http.js'
      - 'test/chain-labs-multi.php'
      - 'test/chain-labs-multi-http.js'
      - 'test/chain-labs-purchase.php'
      - 'test/chain-labs-purchase-http.js'
      - 'test/support/**'
      - '.github/workflows/chain-labs.yml'
  pull_request:
    paths:
      - 'chain-labs/**'
      - 'test/chain-labs-import.js'
      - 'test/chain-labs-config.js'
      - 'test/chain-labs-ledger.php'
      - 'test/chain-labs-coin-form.js'
      - 'test/chain-labs-spend.php'
      - 'test/chain-labs-spend-http.js'
      - 'test/chain-labs-multi.php'
      - 'test/chain-labs-multi-http.js'
      - 'test/chain-labs-purchase.php'
      - 'test/chain-labs-purchase-http.js'
      - 'test/support/**'
      - '.github/workflows/chain-labs.yml'

permissions:
  contents: read

concurrency:
  group: chain-labs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.1']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, pdo_sqlite, curl

      - name: Chain labs checks
        run: |
          node test/chain-labs-import.js
          node test/chain-labs-config.js
          php test/chain-labs-ledger.php
          node test/chain-labs-coin-form.js
          php test/chain-labs-spend.php
          node test/chain-labs-spend-http.js
          php test/chain-labs-multi.php
          node test/chain-labs-multi-http.js
          php test/chain-labs-purchase.php
          node test/chain-labs-purchase-http.js
