  <h1>Neighbor Workshop</h1>
  <p>A second, independent domain on port 8002 — a single-world manifest (a
     <code>worlds</code> array of length one) that portals back to Example
     Plaza's <code>plaza</code> world on port 8001, proving cross-domain
     traversal works alongside the same-origin world-to-world portals over
     there.</p>
