<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Domain Atlas — Asset Studio</title><link rel="stylesheet" href="studio.css"></head><body><main><header><h1>Asset Studio <small>Preview v0.1</small></h1><p>Create a design first. Minting is not enabled yet.</p></header><section class="layout"><form id="editor"><label for="template">Template</label><select id="template"><option value="trophy">Achievement Trophy</option><option value="badge">Explorer Badge</option><option value="key">Portal Key</option></select><label for="assetName">Asset name</label><input id="assetName" maxlength="64" value="Achievement Trophy"><label for="description">Description</label><textarea id="description" maxlength="240" rows="4">Awarded in recognition of outstanding achievement.</textarea><label for="finish">Finish</label><select id="finish"><option value="gold">Gold</option><option value="silver">Silver</option><option value="bronze">Bronze</option></select><div class="buttons"><button type="button" id="copy">Copy design JSON</button><button type="button" id="download">Download design</button><button type="button" id="validate">Validate with PHP</button><button type="button" id="mint" disabled>Mint to Wallet (coming later)</button></div></form><section class="preview"><canvas id="preview" width="500" height="420" aria-label="Asset preview"></canvas><h2 id="previewName"></h2><p id="previewDescription"></p><p id="walletStatus">Checking wallet bridge…</p><pre id="json"></pre><p id="message" role="status"></p></section></section></main><script src="studio.js"></script></body></html>
